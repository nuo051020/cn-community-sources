# 统一中文社区来源适配器配置示例
#
# 复制为 config.toml 后按需修改；默认路径为 tools/source_adapter/config.toml，
# 也可用 --config 指定。CLI 参数优先于本文件。
#
# 本文件只保存非敏感参数：任何含 token / api_key / secret / password / credential
# 的键都会被配置加载器直接拒绝。密钥只能放在环境变量或 Codex 安全配置中。
# Just One API 的 endpoint_id 也不在这里配置：必须由会话内的发现工具在运行时返回。

[run]
# 运行产物与缓存位置（相对 tools/source_adapter，或写绝对路径）
output_root = "outputs"
cache_dir = ".cache"
# 默认并发固定为 1；允许 2，不得超过 2（当前实现为顺序执行）
concurrency = 1
# 同一平台的请求间隔（秒），允许范围 1.5-3.0
request_spacing_seconds = 2.0
# 429 / 408 / 5xx / 临时网络错误的最多重试次数（合计最多 retries + 1 次请求）
max_retries = 3
# 单次 HTTP 响应体上限（字节）
max_response_bytes = 2000000
# AnySearch CLI 单次调用超时（秒）与输出上限（字符）
anysearch_timeout_seconds = 60.0
anysearch_max_output = 500000
# AnySearch skill 目录；留空则按 ANYSEARCH_SKILL_DIR 或 ~/.codex/skills/anysearch 发现
anysearch_skill_dir = ""
# 贴吧公开移动端搜索入口与分页
tieba_search_url = "https://tieba.baidu.com/mo/q/search/thread"
tieba_page_size = 20
tieba_page_limit = 1
# 贴吧深挖（需 aiotieba）
aiotieba_page_limit = 1
aiotieba_include_nested = false
# Just One API MCP 服务名（凭据由会话持有，本地不保存）
justone_server = "justoneapi"
