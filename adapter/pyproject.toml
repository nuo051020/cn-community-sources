[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "source-adapter"
version = "0.1.0"
description = "Anonymous, read-only adapter that unifies Tieba, AnySearch and Just One API evidence into traceable research records."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
tieba = ["aiotieba>=4.5"]

[project.scripts]
source-adapter = "source_adapter.cli:main"

[tool.setuptools]
packages = ["source_adapter", "source_adapter.providers"]
